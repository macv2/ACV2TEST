---
- name: Gather package facts
  hosts: all
  become: yes
  tasks:
    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Show total number of installed packages
      ansible.builtin.debug:
        msg: "Total packages installed: {{ ansible_facts['packages'] | length }}"

    - name: Show packages report
      ansible.builtin.debug:
        msg: " {{ ansible_facts['packages'] | replace('\\n', '\n') | to_nice_json  }}"

       # msg: " {{ ansible_facts['packages'] | list }}"        
