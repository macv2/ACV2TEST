---
- name: Export Configuration from AAP
  hosts: localhost
  #connection: local
  gather_facts: false
  environment:
    controller_api_base_path: "/api/controller/v2/"
    AWXKIT_API_BASE_PATH: "/api/controller/"
  collections:
    - ansible.platform
    - ansible.controller
    - infra.aap_configuration

  vars:
    # Target server connection details
    controller_username: "{{ controller_user }}"
    controller_password: "{{ controller_pw }}" 
    controller_validate_certs: false

  tasks:
    - name: Export all
      ansible.controller.export:
        controller_host: "aap.bnzvd.sandbox5552.opentlc.com"
        controller_username: "lab-user"
        controller_password: "NDE3NjA1OTcy"
        validate_certs: false
        organizations: all
        projects: all
        job_templates: all
      register: export_results

    - name: Save exported objects to a YAML file
      copy:
        content: "{{ export_results | to_nice_yaml(explicit_start=true, explicit_end=true) }}"
        dest: "/tmp/exported_projects.yaml"
