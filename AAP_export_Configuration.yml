---
- name: Export Configuration from AAP
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - name: ansible.platform
      version: ">=2.6.0"
    - name: ansible.controller
      version: ">=4.7.0"
    - name: infra.aap_configuration
      version: ">=4.7.0"

  vars:
    # Target server connection details
    controller_username: "{{ controller_user }}"
    controller_password: "{{ controller_pw }}" 
    controller_validate_certs: false

  tasks:
    - name: Export all projects
      ansible.controller.export:
        all: true
      register: export_results

    - name: Save exported objects to a YAML file
      ansible.builtin.copy:
        content: "{{ export_results | to_nice_yaml(explicit_start=true, explicit_end=true) }}"
        dest: "/tmp/exported_projects.yaml"
